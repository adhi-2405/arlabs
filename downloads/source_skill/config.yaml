# AR LABS Stream Clips Skill Configuration
version: "1.2.0"
game_presets:
  gta6:
    name: "Grand Theft Auto VI"
    keywords: ["busted", "wasted", "heist", "police chase", "stunt", "drift", "vice city", "lucia", "jason"]
    audio_spike_threshold_db: -12.0
    min_silence_duration: 1.5
    default_clip_duration_sec: 45
    min_clip_duration_sec: 25
    max_clip_duration_sec: 60

video_processing:
  target_aspect_ratio: "9:16"
  target_resolution: [1080, 1920]
  fps: 60
  # Layouts: 'split' (cam top / gameplay bottom), 'crop' (center 9:16 crop), 'blur_pad' (16:9 padded with blurred bg)
  default_layout: "split"
  split_layout_ratios:
    camera_height_ratio: 0.38
    gameplay_height_ratio: 0.62

subtitles:
  enabled: true
  font_name: "Arial Black"
  font_size: 42
  primary_color: "&H00FFFFFF"     # White
  highlight_color: "&H002BF5FF"   # Vibrant Yellow
  outline_color: "&H00000000"     # Black border
  outline_width: 4
  shadow: 2
  max_words_per_line: 4
