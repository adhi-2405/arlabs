<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="520" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Main Showcase Container Card -->
  <rect x="20" y="20" width="480" height="400" rx="24" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Header bar inside card -->
  <g transform="translate(44, 44)">
    <!-- Terminal window dots -->
    <circle cx="8" cy="8" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="24" cy="8" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="40" cy="8" r="5" fill="#10B981" opacity="0.8"/>
    <text x="65" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#64748B">AR LABS AUTOMATION ENGINE</text>
    <rect x="360" y="0" width="70" height="20" rx="10" fill="#EEF2FF"/>
    <text x="395" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="700" fill="#4F46E5" text-anchor="middle">ACTIVE</text>
  </g>

  <!-- Pipeline Step 1: Input Stream -->
  <g transform="translate(44, 88)">
    <rect width="432" height="66" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="14" y="14" width="38" height="38" rx="10" fill="#FEE2E2"/>
    <!-- Video Play Icon -->
    <path d="M28 26 L38 33 L28 40 Z" fill="#DC2626"/>
    <text x="66" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700" fill="#0F172A">Raw Livestream Ingest</text>
    <text x="66" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" fill="#64748B">YouTube VOD / Local MP4 (3h 42m)</text>
    <rect x="340" y="22" width="76" height="22" rx="6" fill="#F1F5F9"/>
    <text x="378" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">1080p 60fps</text>
  </g>

  <!-- Connecting Line 1 -->
  <line x1="260" y1="154" x2="260" y2="174" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="260" cy="164" r="3" fill="#6366F1"/>

  <!-- Pipeline Step 2: AI Multi-Modal Engine -->
  <g transform="translate(44, 174)">
    <rect width="432" height="92" rx="14" fill="#F8FAFC" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="14" y="18" width="42" height="42" rx="12" fill="url(#accentGrad)"/>
    <!-- Sparkle / AI icon -->
    <path d="M35 27 L37 34 L44 36 L37 38 L35 45 L33 38 L26 36 L33 34 Z" fill="#FFFFFF"/>
    
    <text x="70" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="800" fill="#1E1B4B">AI Semantic &amp; Audio Spike Engine</text>
    <text x="70" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" fill="#475569">Whisper transcription + Gemini 2.5 Flash Hype Scoring</text>
    
    <!-- Mini Metric Chips -->
    <rect x="70" y="64" width="94" height="20" rx="5" fill="#E0E7FF"/>
    <text x="117" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="700" fill="#4338CA" text-anchor="middle">Audio Peaks: -5dB</text>

    <rect x="172" y="64" width="96" height="20" rx="5" fill="#EDE9FE"/>
    <text x="220" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="middle">Hype Score: 9.4/10</text>

    <rect x="276" y="64" width="84" height="20" rx="5" fill="#DCFCE7"/>
    <text x="318" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">5 Clips Found</text>
  </g>

  <!-- Connecting Line 2 -->
  <line x1="260" y1="266" x2="260" y2="286" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="260" cy="276" r="3" fill="#6366F1"/>

  <!-- Pipeline Step 3: Vertical 9:16 Export -->
  <g transform="translate(44, 286)">
    <rect width="432" height="88" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- 3 Mini Vertical Previews -->
    <g transform="translate(18, 12)">
      <rect width="36" height="64" rx="6" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
      <rect x="4" y="4" width="28" height="18" rx="3" fill="#312E81"/>
      <text x="18" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="6" font-weight="700" fill="#FCD34D" text-anchor="middle">CLIP 1</text>
    </g>

    <g transform="translate(60, 12)">
      <rect width="36" height="64" rx="6" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1"/>
      <rect x="4" y="4" width="28" height="18" rx="3" fill="#4C1D95"/>
      <text x="18" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="6" font-weight="700" fill="#FCD34D" text-anchor="middle">CLIP 2</text>
    </g>

    <g transform="translate(102, 12)">
      <rect width="36" height="64" rx="6" fill="#1E1B4B" stroke="#EC4899" stroke-width="1"/>
      <rect x="4" y="4" width="28" height="18" rx="3" fill="#831843"/>
      <text x="18" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="6" font-weight="700" fill="#FCD34D" text-anchor="middle">CLIP 3</text>
    </g>

    <text x="156" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700" fill="#0F172A">Exported Vertical Shorts (9:16)</text>
    <text x="156" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" fill="#64748B">Auto kinetic captions + viral title metadata</text>

    <rect x="344" y="32" width="76" height="26" rx="8" fill="#10B981"/>
    <text x="382" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">READY</text>
  </g>

  <!-- Creator Brand Watermark -->
  <text x="440" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="600" fill="#94A3B8" text-anchor="end">AR LABS · EXPLORE. AUTOMATE. CREATE.</text>
</svg>