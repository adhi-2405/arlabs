<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="600" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="waveformGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgGlow)"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Glowing Sun / Vice City Horizon -->
  <circle cx="300" cy="190" r="110" fill="#E11D48" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="300" cy="190" r="75" fill="url(#neonPink)" opacity="0.25"/>

  <!-- GTA 6 Stream Landscape Silhouette -->
  <path d="M0 260 L80 230 L160 250 L250 210 L340 240 L450 205 L520 235 L600 220 L600 360 L0 360 Z" fill="#0B0F19" opacity="0.85"/>
  <!-- Palm silhouettes -->
  <path d="M480 250 Q485 180 515 160 Q495 165 475 180 Q515 170 540 185 Q500 185 488 200 Q525 205 535 225 Q495 210 480 250 Z" fill="#07090E"/>
  <path d="M120 265 Q115 190 85 170 Q105 175 125 190 Q85 180 60 195 Q100 195 112 210 Q75 215 65 235 Q105 220 120 265 Z" fill="#07090E"/>

  <!-- Center: Vertical 9:16 Crop Overlay Box -->
  <rect x="235" y="40" width="130" height="231" rx="12" fill="#000000" fill-opacity="0.6" stroke="url(#neonCyan)" stroke-width="2.5" filter="url(#softGlow)"/>
  
  <!-- Vertical frame header -->
  <rect x="235" y="40" width="130" height="24" rx="12" fill="#1E293B" fill-opacity="0.9"/>
  <circle cx="249" cy="52" r="3" fill="#EF4444"/>
  <text x="257" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8" font-weight="700" fill="#F8FAFC" letter-spacing="0.05em">9:16 SHORTS</text>
  
  <!-- Facecam Split Box inside Vertical frame -->
  <rect x="245" y="70" width="110" height="58" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
  <circle cx="270" cy="98" r="12" fill="#4F46E5"/>
  <path d="M260 118 Q270 110 280 118 Z" fill="#6366F1"/>
  <rect x="290" y="88" width="55" height="6" rx="3" fill="#E2E8F0" opacity="0.8"/>
  <rect x="290" y="100" width="38" height="5" rx="2.5" fill="#94A3B8" opacity="0.6"/>

  <!-- Gameplay Focus inside vertical frame -->
  <rect x="245" y="136" width="110" height="95" rx="6" fill="#1E1B4B" stroke="#6366F1" stroke-width="1" stroke-dasharray="2 2"/>
  <!-- Crosshair -->
  <circle cx="300" cy="183" r="10" stroke="#F43F5E" stroke-width="1.5" fill="none"/>
  <line x1="300" y1="168" x2="300" y2="198" stroke="#F43F5E" stroke-width="1"/>
  <line x1="285" y1="183" x2="315" y2="183" stroke="#F43F5E" stroke-width="1"/>
  <!-- Subtitle badge preview -->
  <rect x="250" y="210" width="100" height="15" rx="4" fill="#000000" fill-opacity="0.85"/>
  <text x="300" y="221" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8" font-weight="800" text-anchor="middle" fill="#FDE047">INSANE POLICE ESCAPE!</text>

  <!-- Audio Waveform with AI Spike Markers -->
  <g transform="translate(60, 280)">
    <rect x="-10" y="-8" width="490" height="42" rx="8" fill="#0B0F19" fill-opacity="0.85" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Waveform bars -->
    <path d="M10 14 L10 18 M20 10 L20 22 M30 12 L30 20 M40 6 L40 26 M50 13 L50 19 M60 8 L60 24 M70 15 L70 17 
             M80 4 L80 28 M90 2 L90 30 M100 0 L100 32 M110 5 L110 27 M120 12 L120 20 M130 9 L130 23 
             M140 14 L140 18 M150 11 L150 21 M160 3 L160 29 M170 1 L170 31 M180 5 L180 27 M190 12 L190 20 
             M200 15 L200 17 M210 10 L210 22 M220 8 L220 24 M230 0 L230 32 M240 2 L240 30 M250 7 L250 25
             M260 13 L260 19 M270 11 L270 21 M280 6 L280 26 M290 0 L290 32 M300 1 L300 31 M310 4 L310 28
             M320 12 L320 20 M330 9 L330 23 M340 7 L340 25 M350 2 L350 30 M360 4 L360 28 M370 12 L370 20
             M380 15 L380 17 M390 10 L390 22 M400 3 L400 29 M410 1 L410 31 M420 8 L420 24 M430 14 L430 18
             M440 11 L440 21 M450 7 L450 25 M460 14 L460 18" 
          stroke="url(#waveformGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- AI Highlight Flag -->
    <g transform="translate(230, -18)">
      <rect x="-24" y="0" width="48" height="15" rx="4" fill="#6366F1"/>
      <text x="0" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8" font-weight="800" text-anchor="middle" fill="#FFFFFF">9.4 ★</text>
      <polygon points="0,17 -3,14 3,14" fill="#6366F1"/>
    </g>
    <g transform="translate(95, -18)">
      <rect x="-24" y="0" width="48" height="15" rx="4" fill="#EC4899"/>
      <text x="0" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8" font-weight="800" text-anchor="middle" fill="#FFFFFF">9.1 ★</text>
      <polygon points="0,17 -3,14 3,14" fill="#EC4899"/>
    </g>
  </g>

  <!-- Floating Badges -->
  <g transform="translate(30, 40)">
    <rect width="130" height="34" rx="8" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="17" r="4" fill="#10B981"/>
    <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">GTA 6 PRESET</text>
  </g>

  <g transform="translate(440, 40)">
    <rect width="130" height="34" rx="8" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#A855F7">AI HIGHLIGHTS</text>
  </g>
</svg>