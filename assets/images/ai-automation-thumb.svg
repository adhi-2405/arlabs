<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="autoBg" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="14" fill="url(#autoBg)"/>
  <!-- Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="80" y1="0" x2="80" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="320" y1="0" x2="320" y2="240"/>
  </g>
  <!-- Pipeline Nodes -->
  <circle cx="80" cy="120" r="28" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
  <text x="80" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">RSS</text>

  <line x1="108" y1="120" x2="172" y2="120" stroke="url(#cyanLine)" stroke-width="3" stroke-dasharray="4 2"/>

  <circle cx="200" cy="120" r="28" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
  <text x="200" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">LLM</text>

  <line x1="228" y1="120" x2="292" y2="120" stroke="url(#cyanLine)" stroke-width="3" stroke-dasharray="4 2"/>

  <circle cx="320" cy="120" r="28" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <text x="320" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">AUTO</text>

  <rect x="26" y="24" width="130" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="91" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">AI AUTOMATION</text>
  <text x="370" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="end">AR LABS WORKFLOW</text>
</svg>